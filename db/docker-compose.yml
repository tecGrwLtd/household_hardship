services:
  hardship-db:
    image: postgres:16
    container_name: hardship_platform_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: hardship_platform
      POSTGRES_USER: hardship_app
      POSTGRES_PASSWORD: hardship_dev_only   # change before anything but local dev
    ports:
      - "5432:5432"
    volumes:
      - hardship_db_data:/var/lib/postgresql/data
      # Anything dropped in docker-entrypoint-initdb.d runs once, in filename
      # order, the first time the container starts with an empty data dir.
      - ./schema.sql:/docker-entrypoint-initdb.d/01_schema.sql
      - ./views.sql:/docker-entrypoint-initdb.d/02_views.sql
      - ./seed:/seed   # CSVs are loaded separately via load_data.py (see README)

volumes:
  hardship_db_data:
